<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Biblioteca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="Css/catalogo.css">
  
  <meta name='viewport' content='width=device-width, initial-scale=1'>
</head>
<body>
    <nav>
        <a href="index.html" class="logo"><img src="Img/logo.png" width="20" height="20" alt="Logo">Biblioteca</a>
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="catalogo.html">Catalogo</a></li>
          <li><a href="tramites.html">Tramites</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
  </nav>
<main class="busca">
  <div class="contenedor">
    <h1>BUSCADOR DE LIBROS</h1>
    
    <input type="text" id="inputBusqueda" placeholder="Escribe el título de un libro...">
    
    <!-- lista para mostrar libros -->
    <ul id="listaLibros"></ul>
  </div>
  </main>


    <footer>
     <p>© 2026 Biblioteca Provincial - Todos los derechos reservados</p>
    </footer>

    <script>
        let ubicacionAnterior = window.scrollY;
        const navbar = document.querySelector('nav');

        window.addEventListener('scroll', () => {
            let ubicacionActual = window.scrollY;

            if (ubicacionAnterior < ubicacionActual && ubicacionActual > 50) {
                navbar.classList.add('nav-oculto');
            } 
            else {
                navbar.classList.remove('nav-oculto');
            }

            ubicacionAnterior = ubicacionActual;
        });
    </script>
    <script src="Js\script.js"></script>




</body>
</html>
